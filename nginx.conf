events {
    worker_connections 1024;
}

stream {
    upstream backend {
        server api1:8080 max_fails=3 fail_timeout=1s;
        server api2:8080 max_fails=3 fail_timeout=1s;
    }
    server {
        listen 9999 backlog 4096;
        proxy_pass backend;
        proxy_connect_timeout 1s;
        proxy_timeout 10s;
        proxy_next_upstream on;
        proxy_next_upstream_timeout 2s;
        proxy_next_upstream_tries 3;
    }
}
