[package]
name = "rinha-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "build-index"
path = "src/build_index.rs"

[[bin]]
name = "load-debug"
path = "src/load_debug.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
half = "2"
bytemuck = "1"
