global
    maxconn 8192
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 2
    timeout connect 1s
    timeout client 5s
    timeout server 5s
    timeout queue 2s

frontend main
    bind *:9999 backlog 4096
    maxconn 12000
    default_backend api

backend api
    balance roundrobin
    default-server maxconn 3000
    server api1 /sockets/api1.sock
    server api2 /sockets/api2.sock
