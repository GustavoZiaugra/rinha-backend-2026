[package]
name = "rinha-fraud-2026"
version = "0.1.0"
edition = "2021"

[dependencies]
mimalloc = "0.1"
flate2 = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "rinha-api"
path = "src/main.rs"

[[bin]]
name = "build-index"
path = "src/build_index.rs"
