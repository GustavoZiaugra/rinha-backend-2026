services:
  api1:
    image: ttl.sh/rinha-gustavo-2026:v47
    environment:
      - BIND=0.0.0.0:8080
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api2:
    image: ttl.sh/rinha-gustavo-2026:v47
    environment:
      - BIND=0.0.0.0:8080
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  lb:
    image: ttl.sh/rinha-gustavo-2026:v47
    command: ["/lb"]
    environment:
      - PORT=9999
      - UPSTREAMS=api1:8080,api2:8080
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30M"
