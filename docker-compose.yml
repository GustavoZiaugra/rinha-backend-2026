services:
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-api:latest
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "160MB"
    expose:
      - "8080"
    restart: unless-stopped

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-api:latest
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "160MB"
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: "30MB"
    restart: unless-stopped
