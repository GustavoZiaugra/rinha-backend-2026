services:
  api1:
    image: ttl.sh/rinha-gustavo-2026:v18
    environment:
      - BIND=0.0.0.0:8080
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api2:
    image: ttl.sh/rinha-gustavo-2026:v18
    environment:
      - BIND=0.0.0.0:8080
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30M"
